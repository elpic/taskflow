version: 2

project_name: taskflow-mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: taskflow-mcp
    main: ./cmd/taskflow-mcp
    binary: taskflow-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/elpic/taskflow/pkg/version.Version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: taskflow-mcp
    ids:
      - taskflow-mcp
    name_template: "taskflow-mcp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: elpic
    name: taskflow
  draft: false
  prerelease: auto
  mode: replace
  name_template: "v{{ .Version }}"
